name: ESLint

on:
  push:
    branches: ["main"]
    paths:
      - "src/Web/**.js"
      - "src/Web/**.jsx"
      - "src/Web/**.ts"
      - "src/Web/**.tsx"
  pull_request:
    branches: ["main"]
    paths:
      - "src/Web/**.js"
      - "src/Web/**.jsx"
      - "src/Web/**.ts"
      - "src/Web/**.tsx"

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/Web
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
